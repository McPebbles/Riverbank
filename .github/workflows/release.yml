name: Release

# Tag a commit v1.0.0 and push it. This builds a signed release APK, attaches it
# to a GitHub Release, and then rebuilds the F-Droid repo index and publishes it
# to GitHub Pages.
#
# Secrets required (Settings -> Secrets and variables -> Actions):
#   SIGNING_KEYSTORE_B64   base64 of the app upload keystore (.jks/.p12)
#   SIGNING_KEYSTORE_PASS  keystore password
#   SIGNING_KEY_ALIAS      key alias
#   SIGNING_KEY_PASS       key password
#   FDROID_KEYSTORE_B64    base64 of the F-Droid *repo index* keystore
#   FDROID_KEYSTORE_PASS   repo keystore password
#   FDROID_KEY_PASS        repo key password
#   FDROID_KEY_ALIAS       repo key alias (e.g. riverbank-repo)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.locate.outputs.apk }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Assemble signed release APK
        env:
          RIVERBANK_KEYSTORE: ${{ runner.temp }}/upload.keystore
          RIVERBANK_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASS }}
          RIVERBANK_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          RIVERBANK_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASS }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Locate APK
        id: locate
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

  fdroid:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: incoming

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver apksigner

      - name: Restore repo signing keystore
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          echo "$FDROID_KEYSTORE_B64" | base64 -d > fdroid/keystore.p12

      - name: Write fdroid config
        env:
          KS_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          sed -e "s|https://OWNER.github.io/riverbank-fdroid|$PAGES_URL|g" \
              -e "s|OWNER|${{ github.repository_owner }}|g" \
              fdroid/config.yml.template > fdroid/config.yml
          python3 - <<'PY'
          import os, re
          p = "fdroid/config.yml"
          s = open(p).read()
          s = s.replace('keystorepass: "CHANGE_ME"', 'keystorepass: "%s"' % os.environ["KS_PASS"])
          s = s.replace('keypass: "CHANGE_ME"', 'keypass: "%s"' % os.environ["KEY_PASS"])
          s = re.sub(r'repo_keyalias: ".*"', 'repo_keyalias: "%s"' % os.environ["KEY_ALIAS"], s)
          open(p, "w").write(s)
          PY
          chmod 600 fdroid/config.yml

      - name: Build the repo index
        run: |
          set -euo pipefail
          cd fdroid
          mkdir -p repo
          cp ../incoming/*.apk repo/
          fdroid update --pretty --create-metadata --verbose

      - name: Assemble the Pages site
        run: |
          set -euo pipefail
          mkdir -p site/fdroid
          cp -r fdroid/repo site/fdroid/repo
          [ -d fdroid/archive ] && cp -r fdroid/archive site/fdroid/archive || true
          cp docs/pages-index.html site/index.html
          # Never publish signing material.
          rm -f site/fdroid/repo/keystore.p12 site/fdroid/repo/config.yml

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
